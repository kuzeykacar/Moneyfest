<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyProof – Landlord</title>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">KeyProof</a>
    <span class="who" id="who"></span>
    <span class="sp"></span>
    <span id="langBox"></span>
  </header>
  <div class="app">
    <aside class="side"><div class="stepinfo" id="stepinfo"></div><ol class="steps" id="progress"></ol></aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <footer class="foot"><a href="/admin.html" id="fAdmin"></a></footer>
</div>

<script src="zk/snarkjs.min.js"></script>
<script src="zk/keyproof.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="simple.js"></script>
<script>
const { api, esc, eur, $, t } = KP;
const Z = window.KeyProofZK;
let S = null, editing = true, draft = null, aiNote = "", lastSig = "", listingDraft = null;
const readListing = () => ($("fAddr") ? { address: $("fAddr").value, kind: $("fKind").value, move_in: $("fMove").value, landlord: $("fLand").value, rent: $("rent").value, deposit: $("deposit").value } : listingDraft);
let verdict = null;      // {asset, ok, steps, summary}
let verifying = false, vk = null;
let ownerKey = KP.param("o"), isOwner = null;

const EXAMPLES = {
  en: ["Adult student, earns at least 1500 a month, studying until 2027-07-31", "Working professional, salary 2000+, savings of 5000", "Students welcome, parents as guarantor with 3000 income"],
  it: ["Studente maggiorenne con almeno 1200 euro al mese", "Lavoratore con stipendio di almeno 2000 euro e 5000 di risparmi", "Studenti con un genitore garante che guadagna 3000 euro"],
  tr: ["Ayda en az 1500 euro kazanan reşit bir öğrenci", "En az 2000 euro maaşlı ve 5000 euro birikimi olan çalışan", "Kefili ayda 3000 euro kazanan öğrenciler"],
};
function setProgress(step) { KP.steps([t("sl_desc"), t("sl_pub"), t("sl_res")], step); }

function screenNotOwner() {
  setProgress(1);
  return `<div class="card"><h1 class="withicon">${KP.icon("lock", 26)} ${t("not_owner")}</h1><p class="dim">${t("not_owner_text")}</p>
    <button class="btn" id="createNew">${t("create_new")}</button></div>`;
}

// ------------------------------------------------------------ step 1: describe + confirm the form
function emptyRules() { return { checks: { identity: false, income: false, occupation: false, savings: false, guarantor: false }, sex: "", minIncome: 0, allowStudent: false, allowEmployed: false, leaseEnd: "", minSavings: 0, minGuarantor: 0 }; }
function screenForm() {
  setProgress(1);
  const r = draft || emptyRules();
  const L = Object.assign({ address: "Via Nizza 45, 10125 Torino", kind: "2", move_in: "2026-11-01", landlord: "Giulia Bianchi" }, listingDraft || (S.request && S.request.listing) || {});
  const tog = (s, extra) => `<label class="toggle"><input type="checkbox" data-c="${s}" ${r.checks[s] ? "checked" : ""}>
      <div><div class="title">${esc(KP.ruleText(s, r))}</div>${extra ? `<div class="opts">${extra}</div>` : ""}</div></label>`;
  const num = (id, v) => `€ <input type="number" id="${id}" value="${v || ""}" min="0" step="50" inputmode="numeric">`;
  return `<div class="card"><h1>${t("l1_title")}</h1><p class="dim">${t("l1_text")}</p>
      <textarea id="text" aria-label="${esc(t("l1_title"))}">${esc($("text") ? $("text").value : (EXAMPLES[KP.lang()] || EXAMPLES.en)[0])}</textarea>
      <div class="chips">${(EXAMPLES[KP.lang()] || EXAMPLES.en).map((e, i) => `<button class="chip" data-ex="${i}">${esc(e)}</button>`).join("")}</div>
      <button class="btn block" id="fill">${KP.icon("sparkle")} ${t("fill")}</button>
      ${aiNote ? `<div class="helper"><div class="who">${KP.icon("sparkle", 14)} ${t("helper")}</div>${esc(aiNote)}</div>` : ""}</div>
    ${draft ? `<div class="card"><h2>${t("l_rules")}</h2>
      ${tog("identity", `<label class="small dim">${t("sex_label")}
          <select id="sex">${["", "F", "M"].map((v) => `<option value="${v}" ${(r.sex || "") === v ? "selected" : ""}>${t(v ? "sex_only_" + v : "sex_any")}</option>`).join("")}</select></label>
          ${r.sex ? `<div class="small dim">${t("sex_note")}</div>` : ""}`)}
      ${tog("income", num("minIncome", r.minIncome))}
      ${tog("occupation", `<label><input type="checkbox" id="allowStudent" ${r.allowStudent ? "checked" : ""}> ${t("occ_student")}</label>
                           <label><input type="checkbox" id="allowEmployed" ${r.allowEmployed ? "checked" : ""}> ${t("occ_employed")}</label>
                           <input type="date" id="leaseEnd" value="${r.leaseEnd || ""}">`)}
      ${tog("savings", num("minSavings", r.minSavings))}
      ${tog("guarantor", num("minGuarantor", r.minGuarantor))}
      <h2 style="margin-top:22px">${t("l_flat")}</h2>
      <div class="formGrid">
        <label style="grid-column:1/-1">${t("f_address")}<input id="fAddr" value="${esc(L.address)}" placeholder="Via Nizza 45, 10125 Torino"></label>
        <label>${t("f_kind")}<select id="fKind">${t("kinds").split("|").map((k, i) => `<option value="${i}" ${String(L.kind) === String(i) ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>
        <label>${t("f_movein")}<input type="date" id="fMove" value="${esc(L.move_in)}"></label>
        <label>${t("rent")} (€${t("per_month")})<input type="number" id="rent" value="${esc(L.rent || (S.request ? S.request.rent : 550))}" min="0" step="10"></label>
        <label>${t("deposit")} (€)<input type="number" id="deposit" value="${esc(L.deposit || (S.request ? S.request.deposit : 1100))}" min="0" step="10"></label>
        <label>${t("f_landlord")}<input id="fLand" value="${esc(L.landlord)}" placeholder="Giulia Bianchi"></label>
      </div>
      <button class="btn ok block" id="publish" style="margin-top:16px">${t("publish")} →</button></div>` : ""}`;
}
function readDraft() {
  const r = emptyRules();
  document.querySelectorAll("input[data-c]").forEach((el) => (r.checks[el.dataset.c] = el.checked));
  const v = (id) => ($(id) ? +$(id).value || 0 : 0);
  r.minIncome = v("minIncome"); r.minSavings = v("minSavings"); r.minGuarantor = v("minGuarantor");
  r.allowStudent = $("allowStudent") ? $("allowStudent").checked : false;
  r.allowEmployed = $("allowEmployed") ? $("allowEmployed").checked : false;
  r.leaseEnd = $("leaseEnd") ? $("leaseEnd").value : "";
  r.sex = $("sex") ? $("sex").value : "";
  if (r.sex) r.checks.identity = true;
  if (r.checks.occupation && !r.allowStudent && !r.allowEmployed) r.allowStudent = r.allowEmployed = true;
  return r;
}

// ------------------------------------------------------------ step 2/3: waiting, result, deposit
function screenStatus() {
  const req = S.request, r = req.rules, ap = S.tenant.approval;
  const reqHtml = `<div class="card"><h1>${t("l2_title")}</h1>${KP.listingHtml(req, t("l_flat"))}
      ${KP.ticked(r).map((s) => `<div class="result-line"><span class="icon">${KP.icon("dot")}</span>${esc(KP.ruleText(s, r))}</div>`).join("")}
      ${ap ? "" : `<div class="notice wait"><span class="spinner"></span> ${t("l2_wait")}</div>
      <button class="btn secondary" id="edit">${t("new_request")}</button>`}</div>`;
  const link = (S.share_base || location.origin) + "/a/" + req.code;
  const share = `<div class="card share"><div class="shareGrid"><div><h2 class="withicon">${KP.icon("link")} ${t("share_title")}</h2>
      <p class="dim">${t("share_text")}</p>
      <div class="codeBox"><div class="small dim">${t("code_label")}</div><div class="code">${esc(req.code)}</div></div>
      <div class="linkRow"><code>${esc(link)}</code></div>
      <div class="row"><button class="btn" id="copyLink">${KP.icon("copy", 18)} ${t("copy")}</button>
        <button class="btn secondary" id="copyPriv">${KP.icon("lock", 18)} ${t("copy_private")}</button></div>
      <p class="small dim" style="margin-top:12px">${KP.icon("lock", 14)} ${t("private_text")}</p></div>
      <div class="qr">${KP.qrSvg(link)}</div></div></div>`;
  if (!ap) { setProgress(2); return reqHtml + share; }
  setProgress(3);
  let res;
  if (!verdict || verdict.asset !== ap.asset_id) {
    res = `<div class="card"><div class="notice wait"><span class="spinner"></span> ${ap.status === "settled" ? t("l_checking") : t("l_arriving")}</div></div>`;
  } else {
    res = `<div class="card"><div class="notice ${verdict.ok ? "ok" : "bad"} big-result">${KP.icon(verdict.ok ? "shield" : "alert", 22)} ${verdict.ok ? t("l_ok") : t("l_bad")}</div>
      ${KP.ticked(r).map((s) => `<div class="result-line"><span class="icon ${verdict.ok ? "ok" : "bad"}">${KP.icon(verdict.ok ? "check" : "x")}</span>${esc(KP.ruleText(s, r))}</div>`).join("")}
      <p><b>${t("l_never")}</b></p><div id="summary"></div>
      <details class="tech"><summary>${t("tech")}</summary><div class="content"><ul>
        ${verdict.steps.map((st) => `<li>${st[1] ? "✓" : "✗"} ${esc(st[0])}${st[2] ? " – " + esc(st[2]) : ""}</li>`).join("")}
        ${S.landlord.log.filter((l) => l.link).map((l) => `<li>${esc(l.text)} – <a href="${l.link}" target="_blank" rel="noopener">${l.link.split("/").pop().slice(0, 16)}…</a></li>`).join("")}
      </ul></div></details></div>`;
    const d = S.landlord.deposit;
    if (d) res += `<div class="card"><h2>${t("deposit")}</h2><div class="notice ${d.status === "settled" ? "ok" : "wait"}">
        ${d.status === "settled" ? "<b>" + t("l_dep_ok", { amount: eur(d.amount) }) + "</b>" : `<span class="spinner"></span> ${t("l_dep_req", { amount: eur(d.amount) })}`}</div></div>`;
  }
  return reqHtml + res + share;
}

function screenDoneL() {
  KP.steps([t("sl_desc"), t("sl_pub"), t("sl_res")], 4);
  const d = S.landlord.deposit, r = S.request.rules;
  const pay = S.landlord.log.find((l) => l.link && l.text.startsWith("Deposit received"));
  return KP.doneHtml({ sub: t("done_l_sub"), amount: eur(d.amount), token: verdict && verdict.asset, txLink: pay && pay.link,
    privateText: t("pk_l"), nextText: t("next_l"), items: KP.ticked(r).map((x) => KP.ruleText(x, r)), againLabel: t("new_req") });
}

// The landlord's own checks on what arrived in its RGB wallet (same as the developer view).
async function verify() {
  if (verifying || !S.request || !S.tenant.approval) return;
  const box = await api("/api/landlord/inbox");
  if (!box.arrived || (verdict && verdict.asset === box.asset_id)) return;
  verifying = true;
  try {
    vk = vk || (await (await fetch("zk/verification_key.json")).json());
    const { proof, publicSignals } = box.proof;
    const mine = Z.publicRequest(S.request.rules);
    const steps = [["RGB token received and validated by my wallet", true, box.asset_id.slice(0, 30) + "…"],
                   ["Proof matches the hash committed in the RGB contract", box.digest_ok, ""]];
    steps.push(["Zero-knowledge proof is mathematically valid", await snarkjs.groth16.verify(vk, publicSignals, proof), ""]);
    const N = 5, off = 1 + N + 2 * N;
    const names = ["adultCutoff", "minIncome", "allowStudent", "allowEmployed", "leaseEnd", "minSavings", "minGuarantor", "today", "maxAgeDays", "requestId", "requiredSex"];
    steps.push(["Proof uses exactly my rules and my request number",
      mine.enabled.every((e, i) => String(e) === publicSignals[1 + i]) && names.every((k, i) => String(mine[k]) === publicSignals[off + i]), ""]);
    let issuersOk = true; const used = [];
    mine.enabled.forEach((e, i) => {
      if (!e) return;
      const iss = S.trusted.find((x) => x.zk[0] === publicSignals[1 + N + i] && x.zk[1] === publicSignals[1 + 2 * N + i] && x.docTypes.includes(i + 1));
      if (!iss) issuersOk = false; else used.push(iss.name);
    });
    steps.push(["Every document was signed by a trusted issuer", issuersOk, [...new Set(used)].join(", ")]);
    const ok = steps.every((s) => s[1]);
    verdict = { asset: box.asset_id, ok, steps };
    await api("/api/landlord/result", { ok, asset_id: box.asset_id, reason: steps.filter((s) => !s[1]).map((s) => s[0]).join("; ") });
  } finally { verifying = false; }
  refresh(true);
}

async function fillHelpers() {
  if ($("summary") && verdict && verdict.ok) {
    const r = S.request.rules;
    const h = await KP.explain("summary", { items: KP.ticked(r).map((s) => KP.ruleText(s, r)), deposit: eur(S.request.deposit) }, "sum" + verdict.asset);
    if ($("summary")) $("summary").innerHTML = KP.helperHtml(h.text, h.source);
  }
}

function bind() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  document.querySelectorAll("[data-ex]").forEach((el) => (el.onclick = () => { $("text").value = el.textContent; }));
  on("fill", async () => {
    const text = $("text").value; listingDraft = readListing();
    $("fill").disabled = true; $("fill").innerHTML = `<span class="spinner"></span> ${t("filling")}`;
    try {
      const out = await api("/api/landlord/parse", { text });
      draft = out.rules;
      const n = KP.ticked(draft).length;
      aiNote = (KP.lang() === "it" ? `Ho compilato ${n} requisiti. Controllali qui sotto.` : KP.lang() === "tr" ? `${n} şartı doldurdum. Lütfen aşağıda kontrol edin.` : `I filled in ${n} requirements for you. Please check them below.`)
               + (out.source === "qvac" ? ` (${out.model || "local AI"})` : "");
    } catch (e) { aiNote = e.message; }
    render(true, text);
  });
  document.querySelectorAll("input[data-c], #allowStudent, #allowEmployed, #leaseEnd, #minIncome, #minSavings, #minGuarantor, #sex")
    .forEach((el) => (el.onchange = () => { const text = $("text").value; listingDraft = readListing(); draft = readDraft(); render(true, text); }));
  on("publish", async () => {
    const rules = readDraft();
    if (!Object.values(rules.checks).some(Boolean)) return;
    const out = await api("/api/landlord/publish", { rules, rent: $("rent").value, deposit: $("deposit").value, listing: readListing() });
    ownerKey = out.owner; isOwner = true;
    history.replaceState(null, "", "/landlord.html?o=" + encodeURIComponent(ownerKey));
    editing = false; verdict = null; refresh(true);
  });
  on("edit", () => { editing = true; draft = S.request.rules; render(true); });
  on("again", () => { editing = true; draft = null; verdict = null; render(true); });
  on("createNew", () => { editing = true; isOwner = true; draft = null; render(true); });
  on("copyLink", () => KP.copyText((S.share_base || location.origin) + "/a/" + S.request.code, $("copyLink")));
  on("copyPriv", () => KP.copyText(location.href, $("copyPriv")));
}

function render(force, keepText) {
  if (!S) return;
  const showForm = !S.request || editing;
  const gate = S.request && !editing && isOwner === false;
  const sig = JSON.stringify([gate, showForm, KP.lang(), S.request && S.request.rules.requestId, S.tenant.approval, S.landlord.deposit, verdict && verdict.asset, !!draft]);
  if (!force && sig === lastSig) return;
  lastSig = sig;
  const finished = !gate && !showForm && S.landlord.deposit && S.landlord.deposit.status === "settled" && verdict;
  $("main").innerHTML = gate ? screenNotOwner() : showForm ? screenForm() : finished ? screenDoneL() : screenStatus();
  if (keepText !== undefined && $("text")) $("text").value = keepText;
  bind(); fillHelpers(); KP.bindProof();
  if (!showForm && !gate) verify();
}
function labels() {
  KP.badge("who", "home", t("landlord")); $("fAdmin").textContent = t("admin");
}
async function refresh(force) {
  try {
    S = await api("/api/state");
    if (S.request && editing && lastSig === "") editing = false;   // page opened after publishing
    if (S.request && isOwner === null) isOwner = (await api("/api/landlord/owner?o=" + encodeURIComponent(ownerKey))).owner;
    if (S.landlord.result && S.tenant.approval && !verdict) verify();
    render(force);
  } catch (e) { console.error(e); }
}
$("langBox").appendChild(KP.langSelect(() => { labels(); render(true); }));
KP.logo(); labels(); refresh(true); setInterval(() => { refresh(false); if (S && S.tenant.approval && !verdict) verify(); }, 2500);
</script>
</body>
</html>
