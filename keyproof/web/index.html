<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyProof</title>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<div class="wrap">
  <header class="top"><span class="logo">🔑 KeyProof</span><span class="sp"></span><span id="langBox"></span></header>
  <div class="card" style="margin-top:28px">
    <h1 id="hText"></h1>
    <p class="dim" id="hSub"></p>
    <div style="display:grid;gap:14px;margin-top:20px">
      <a class="btn block" href="/tenant.html" id="hTenant"></a>
      <a class="btn secondary block" href="/landlord.html" id="hLandlord"></a>
      <a class="btn secondary block" href="/issuer.html">🏛️ Issuer (bank, comune, university)</a>
    </div>
  </div>
  <footer class="foot"><a href="/wallets.html" id="fWallets"></a><a href="/dev.html" id="fDev"></a></footer>
</div>
<script src="simple.js"></script>
<script>
const { $, t } = KP;
function labels() {
  $("hText").textContent = t("home_text"); $("hSub").textContent = t("home_title");
  $("hTenant").textContent = "👤 " + t("home_tenant"); $("hLandlord").textContent = "🏠 " + t("home_landlord");
  $("fWallets").textContent = t("wallets"); $("fDev").textContent = t("dev");
}
$("langBox").appendChild(KP.langSelect(labels)); labels();
</script>
</body>
</html>
