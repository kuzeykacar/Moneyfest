<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyProof</title>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<div class="wrap">
  <header class="top"><span class="logo">KeyProof</span><span class="sp"></span><span id="langBox"></span></header>
  <div class="app single"><div class="card hero">
    <h1 id="hText"></h1>
    <p class="dim" id="hSub"></p>
    <div style="display:grid;gap:14px;margin-top:20px">
      <a class="btn block" href="/tenant.html" id="hTenant"></a>
      <a class="btn secondary block" href="/landlord.html" id="hLandlord"></a>
      <a class="btn secondary block" href="/issuer.html" id="hIssuer"></a>
    </div>
    <div style="margin-top:26px"><div class="dim" id="hCode"></div>
      <div class="row" style="margin-top:8px"><input id="codeIn" class="codeInput" placeholder="7F3K-92QD" maxlength="9" autocomplete="off">
      <button class="btn secondary" id="openCode"></button></div></div>
  </div></div>
  <footer class="foot"><a href="/wallets.html" id="fWallets"></a><a href="/dev.html" id="fDev"></a></footer>
</div>
<script src="simple.js"></script>
<script>
const { $, t } = KP;
function labels() {
  $("hText").textContent = t("home_text"); $("hSub").textContent = t("home_title");
  $("hTenant").innerHTML = KP.icon("user") + " " + t("home_tenant"); $("hLandlord").innerHTML = KP.icon("home") + " " + t("home_landlord");
  $("hIssuer").innerHTML = KP.icon("landmark") + " " + t("issuer") + " · bank, comune, university";
  $("fWallets").textContent = t("wallets"); $("fDev").textContent = t("dev");
  $("hCode").textContent = t("home_code"); $("openCode").textContent = t("open") + " →";
}
const go = () => { const c = KP.normCode($("codeIn").value); if (c) location.href = "/a/" + c; };
$("openCode").onclick = go; $("codeIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
$("langBox").appendChild(KP.langSelect(labels)); KP.logo(); labels();
</script>
</body>
</html>
