<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyProof – Issuer</title>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/">KeyProof</a><span class="who" id="who"></span><span class="sp"></span><span id="langBox"></span></header>
  <div class="app single"><main id="main"></main></div>
  <footer class="foot"><a href="/tenant.html" id="fTenant"></a><a href="/landlord.html" id="fLandlord"></a><a href="/wallets.html" id="fWallets"></a></footer>
</div>
<script src="simple.js"></script>
<script>
const { api, esc, $, t } = KP;
let S = null, busy = false, lastSig = "";
const CREDS = [[1, "landmark", "Demo Comune di Torino", "d_identity"], [2, "bank", "Banca Demo", "d_income"], [3, "cap", "Demo Politecnico di Torino", "d_occupation"],
               [4, "bank", "Banca Demo", "d_savings"], [5, "bank", "Banca Demo", "d_guarantor"]];
function render(force) {
  const iss = S && S.issuer;
  const sig = JSON.stringify([KP.lang(), iss && iss.status, busy]);
  if (!force && sig === lastSig) return; lastSig = sig;
  const tx = iss && S.tenant.log.find((l) => l.link && l.text.includes("credentials"));
  $("main").innerHTML = `<div class="card"><h1>${t("i_title")}</h1><p class="dim">${t("i_text")}</p>
    ${CREDS.map(([n, ic, who, d]) => `<label class="toggle"><input type="checkbox" data-t="${n}" ${n <= 3 ? "checked" : ""}>
       <div><div class="title withicon">${KP.icon(ic)} ${t(d)}</div><div class="dim small">${esc(who)} → Elena Rossi</div></div></label>`).join("")}
    ${iss ? `<div class="notice ${iss.status === "settled" ? "ok" : "wait"}">${iss.status === "settled" ? "<b>" + t("i_done") + "</b>" : `<span class="spinner"></span> ${t("i_sent")}`}</div>` : ""}
    <button class="btn block" id="send" ${busy ? "disabled" : ""}>${busy ? `<span class="spinner"></span> ${t("i_sending")}` : t("i_send")}</button>
    ${tx ? `<details class="tech"><summary>${t("tech")}</summary><div class="content"><ul><li><a href="${tx.link}" target="_blank" rel="noopener">${tx.link}</a></li>
      ${iss.assets.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div></details>` : ""}</div>`;
  $("send").onclick = async () => {
    const types = [...document.querySelectorAll("input[data-t]:checked")].map((e) => +e.dataset.t);
    if (!types.length || !confirm(t("i_send") + "?")) return;
    busy = true; render(true);
    try { await api("/api/issuer/send", { types }); } catch (e) { alert(e.message); }
    busy = false; refresh(true);
  };
}
function labels() { KP.badge("who", "landmark", t("issuer")); $("fTenant").textContent = t("tenant") + " →"; $("fLandlord").textContent = t("landlord") + " →"; $("fWallets").textContent = t("wallets"); }
async function refresh(force) { try { S = await api("/api/state"); render(force); } catch (e) { console.error(e); } }
$("langBox").appendChild(KP.langSelect(() => { labels(); render(true); }));
KP.logo(); labels(); refresh(true); setInterval(() => refresh(false), 3000);
</script>
</body>
</html>
